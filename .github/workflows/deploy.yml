name: Deploy

# Deploy de produção: disparado por tag v* (deploy de uma tag nova com
# um push) ou manualmente. Build das 3 imagens → push GHCR → deploy SSH
# na VPS (compose pull + up) → smoke test pós-deploy.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/felipebrgs1

jobs:
  build-push:
    name: Build e push GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag da imagem
        id: tag
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push — api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/OpenPc.Api/Dockerfile
          target: final
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/openpc-api:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_BASE }}/openpc-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push — scraper
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/OpenPc.Scraper/Dockerfile
          target: final
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/openpc-scraper:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_BASE }}/openpc-scraper:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push — backup (pg_dump + rclone)
        uses: docker/build-push-action@v6
        with:
          context: deploy/backup
          file: deploy/backup/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/openpc-backup:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_BASE }}/openpc-backup:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push — web
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/openpc-web:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_BASE }}/openpc-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy na VPS (SSH)
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR || '/opt/openpc' }}"
            # autentica no GHCR para puxar imagens privadas
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            git fetch origin --tags
            git checkout "${{ github.ref_name }}"
            IMAGE_TAG="${{ needs.build-push.outputs.image_tag }}" \
              docker compose -f deploy/docker-compose.yml --env-file deploy/.env pull
            IMAGE_TAG="${{ needs.build-push.outputs.image_tag }}" \
              docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
            docker image prune -f

  smoke:
    name: Smoke test pós-deploy
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: ./deploy/smoke-test.sh "https://${{ secrets.VPS_DOMAIN }}"
