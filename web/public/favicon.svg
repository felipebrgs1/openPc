<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Brand Purple) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2471"/>
      <stop offset="50%" stop-color="#3a1d59"/>
      <stop offset="100%" stop-color="#1f0c33"/>
    </linearGradient>

    <!-- Outer Glow Rim -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfa5de" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7440a8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Cyan Die Core -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Contact Pins Light Metallic Accent -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d9ccec"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Squircle Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- 2. CPU Pins (3 bold contact pads on each side) -->
  <g fill="url(#pinGrad)">
    <!-- Top Pins -->
    <rect x="172" y="72" width="36" height="52" rx="10"/>
    <rect x="238" y="72" width="36" height="52" rx="10"/>
    <rect x="304" y="72" width="36" height="52" rx="10"/>

    <!-- Bottom Pins -->
    <rect x="172" y="388" width="36" height="52" rx="10"/>
    <rect x="238" y="388" width="36" height="52" rx="10"/>
    <rect x="304" y="388" width="36" height="52" rx="10"/>

    <!-- Left Pins -->
    <rect x="72" y="172" width="52" height="36" rx="10"/>
    <rect x="72" y="238" width="52" height="36" rx="10"/>
    <rect x="72" y="304" width="52" height="36" rx="10"/>

    <!-- Right Pins -->
    <rect x="388" y="172" width="52" height="36" rx="10"/>
    <rect x="388" y="238" width="52" height="36" rx="10"/>
    <rect x="388" y="304" width="52" height="36" rx="10"/>
  </g>

  <!-- 3. CPU Substrate (Dark Metallic Purple Body) -->
  <rect x="112" y="112" width="288" height="288" rx="44" fill="#240c3c" stroke="#8b57bd" stroke-width="12"/>
  <rect x="124" y="124" width="264" height="264" rx="32" fill="none" stroke="url(#cyanGrad)" stroke-width="4" opacity="0.4"/>

  <!-- 4. Heatspreader / Silicon Socket Frame -->
  <rect x="168" y="168" width="176" height="176" rx="28" fill="#150524" stroke="url(#pinGrad)" stroke-width="6"/>

  <!-- 5. Center Silicon Die + OpenPC "O" Arc -->
  <!-- Cyan Glowing Arc (Opening at top-right for "Open") -->
  <path d="M 256 196 A 60 60 0 1 1 196 256" fill="none" stroke="url(#cyanGrad)" stroke-width="22" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Center Core silicon die node -->
  <rect x="232" y="232" width="48" height="48" rx="12" fill="#ffffff"/>
  <rect x="236" y="236" width="40" height="40" rx="10" fill="url(#cyanGrad)"/>
</svg>
