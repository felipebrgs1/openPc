<a
  routerLink="/pecas/{{ product().categorySlug }}/{{ product().id }}"
  class="group flex h-full flex-col overflow-hidden rounded-xl border border-zinc-200 bg-white shadow-sm transition hover:border-brand-500 hover:shadow"
>
  <div class="flex h-36 items-center justify-center bg-zinc-50 p-3">
    @if (product().imageUrl) {
      <img
        [src]="product().imageUrl"
        [alt]="product().name"
        loading="lazy"
        class="max-h-full max-w-full object-contain"
      />
    } @else {
      <span class="text-sm text-zinc-400">Sem imagem</span>
    }
  </div>
  <div class="flex flex-1 flex-col gap-1 p-3">
    <p class="line-clamp-2 text-sm text-zinc-700 group-hover:text-brand-700">
      {{ product().name }}
    </p>
    <p class="mt-auto pt-1">
      <span class="text-base font-bold text-zinc-900">{{ formatBRL(product().price) }}</span>
      @if (product().storeCount > 1) {
        <span class="ml-1 text-xs text-zinc-500">{{ product().storeCount }} lojas</span>
      }
    </p>
  </div>
</a>
