<header class="bg-brand-900 text-white">
  <div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-4 px-4">
    <a routerLink="/" class="flex items-baseline gap-0.5">
      <span class="text-xl font-bold tracking-tight">
        Open<span class="text-brand-300">PC</span>
      </span>
      <span class="ml-2 hidden text-xs text-brand-200 sm:inline">
        compare preços · monte sem incompatibilidade
      </span>
    </a>
    <a
      routerLink="/montar"
      routerLinkActive="bg-brand-100"
      class="rounded-lg bg-white px-3.5 py-1.5 text-sm font-semibold text-brand-800 shadow-sm transition hover:bg-brand-50"
    >
      Montar meu PC
    </a>
  </div>
</header>

<nav class="sticky top-0 z-40 border-b border-zinc-200 bg-white/95 backdrop-blur">
  <div
    class="mx-auto flex max-w-6xl items-center gap-1 overflow-x-auto px-2 py-1.5 sm:justify-between sm:px-4"
  >
    @for (cat of navCategories(); track cat.id) {
      <a
        routerLink="/pecas/{{ cat.slug }}"
        routerLinkActive="bg-brand-50 text-brand-700"
        class="flex shrink-0 items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-sm font-medium whitespace-nowrap text-zinc-600 transition hover:bg-zinc-100 hover:text-zinc-900"
      >
        <app-category-icon [slug]="cat.slug" [size]="16" />
        {{ cat.name }}
      </a>
    }
  </div>
</nav>

<main class="mx-auto min-h-[60vh] max-w-6xl px-4 py-6">
  <router-outlet />
</main>

<footer class="mt-12 bg-brand-900 text-brand-200">
  <div
    class="mx-auto flex max-w-6xl flex-col gap-3 px-4 py-8 text-sm sm:flex-row sm:items-center sm:justify-between"
  >
    <div>
      <p class="text-base font-bold text-white">Open<span class="text-brand-300">PC</span></p>
      <p class="mt-1 max-w-md text-xs text-brand-300">
        Preços coletados de Kabum, Pichau e Terabyte. Valores e estoque podem
        mudar — confirme sempre na loja antes de comprar.
      </p>
    </div>
    <nav class="flex gap-4 text-xs">
      <a routerLink="/" class="hover:text-white">Catálogo</a>
      <a routerLink="/montar" class="hover:text-white">Montador</a>
    </nav>
  </div>
</footer>
