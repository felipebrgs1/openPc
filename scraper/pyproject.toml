[project]
name = "openpc-scraper"
version = "0.1.0"
description = "Scraper OpenPC (port do scraper C#) — Kabum HTTP + Pichau/Terabyte Playwright"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "parsel>=1.11",
    "playwright>=1.49",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "apscheduler>=3.11",
    "minio>=7.2",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=8",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openpc_scraper"]
