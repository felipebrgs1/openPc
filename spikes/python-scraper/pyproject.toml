[project]
name = "openpc-spike"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "felipeborgaco", email = "felipeborgaco@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "parsel>=1.11.0",
]

