# ============================================================
# OpenPC — ambiente de desenvolvimento (M0)
#
# Stack inteira:
#   docker compose -f deploy/docker-compose.dev.yml up --build -d
#
# Cenário 1 — só a API (db + redis + api; reusa o banco de dev):
#   docker compose -f deploy/docker-compose.dev.yml up -d --build db redis api
#
# Cenário 2 — só o scraper (db + migrate one-shot + scraper; o schema é
#   criado pelo serviço `migrate`, que roda a API com --migrate-only):
#   docker compose -f deploy/docker-compose.dev.yml up -d --build db scraper
#   # coleta manual (ex: Kabum, categoria cpu):
#   docker compose -f deploy/docker-compose.dev.yml exec scraper \
#     dotnet run --project src/OpenPc.Scraper/OpenPc.Scraper.csproj -- run-once kabum cpu
#
# Cenário 3 — front na Cloudflare Worker (detalhes em web/wrangler.jsonc):
#   cd web && npm run dev:cf     # local: http://localhost:8787 (/api -> localhost:5080)
#   cd web && npm run deploy:cf  # publica na Cloudflare
#
# URLs (stack inteira):
#   web   -> http://localhost:4200  (Angular dev server + HMR)
#   api   -> http://localhost:5080  (health: /api/v1/health)
#   db    -> localhost:5432  (openpc / openpc / openpc_dev)
#   redis -> localhost:6379
#
# Alternativa sem containers para web/api (SDK local):
#   cd web && npm start            (proxy -> localhost:5080)
#   dotnet watch run --project src/OpenPc.Api
# ============================================================

name: openpc-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: openpc
      POSTGRES_USER: openpc
      POSTGRES_PASSWORD: openpc_dev
    ports:
      - "5432:5432"
    volumes:
      # PG 18+: mount em /var/lib/postgresql (dados ficam em subdiretório
      # major-version — permite pg_upgrade sem quebra de mount).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpc -d openpc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: src/OpenPc.Api/Dockerfile
      target: development
    environment:
      # Banco REAL da VPS 2 via túnel SSH local (systemd user: openpc-tunnel).
      # Senha em deploy/.env (OPENPC_DB_PASSWORD) — nunca no git.
      ConnectionStrings__Default: Host=host.docker.internal;Port=5433;Database=openpc;Username=openpc;Password=${OPENPC_DB_PASSWORD}
      Redis__ConnectionString: redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5080:8080"
    volumes:
      # obj/ mascarado por volume anônimo: o `dotnet watch` do container
      # escreve nos próprios obj/ e não trava os builds do host.
      - ../src:/src/src
      # props de raiz (Directory.*.props) NÃO ficam em src/ — sem o mount,
      # mudanças como novos PackageVersion exigiriam rebuild da imagem.
      - ../Directory.Build.props:/src/Directory.Build.props:ro
      - ../Directory.Packages.props:/src/Directory.Packages.props:ro
      - /src/src/OpenPc.Api/obj
      - /src/src/OpenPc.Domain/obj
      - /src/src/OpenPc.Infrastructure/obj
      - /src/src/OpenPc.Scraper/obj
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ../web
      target: development
    ports:
      - "4200:4200"
    volumes:
      - ../web/src:/app/src
      - ../web/proxy.conf.container.json:/app/proxy.conf.container.json
    depends_on:
      api:
        condition: service_started

  # One-shot: aplica migrations + seed (API com --migrate-only) e encerra.
  # Em runtime a API é quem migra; aqui só preparamos o banco para o
  # cenário "só scraper" (scraper não roda migrations — decisão M2).
  migrate:
    build:
      context: ..
      dockerfile: src/OpenPc.Api/Dockerfile
      target: final
    entrypoint: ["dotnet", "OpenPc.Api.dll", "--migrate-only"]
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=openpc;Username=openpc;Password=openpc_dev
    depends_on:
      db:
        condition: service_healthy

  # Fotos do catálogo (S3) — mesmo papel do MinIO de produção; só o scraper
  # escreve e o Caddy de dev não expõe /images (para ver, use o console :9001).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        until mc ready local; do sleep 2; done
        mc mb --ignore-existing local/openpc-images
        mc anonymous set download local/openpc-images
    depends_on:
      minio:
        condition: service_healthy

  scraper:
    build:
      context: ..
      dockerfile: src/OpenPc.Scraper/Dockerfile
      target: development
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=openpc;Username=openpc;Password=openpc_dev
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      Minio__Endpoint: minio:9000
      Minio__AccessKey: minioadmin
      Minio__SecretKey: minioadmin
      Minio__Bucket: openpc-images
      Minio__PublicPath: /images
      Minio__UseSsl: "false"
    volumes:
      - ../src:/src/src
      - ../Directory.Build.props:/src/Directory.Build.props:ro
      - ../Directory.Packages.props:/src/Directory.Packages.props:ro
      - /src/src/OpenPc.Api/obj
      - /src/src/OpenPc.Domain/obj
      - /src/src/OpenPc.Infrastructure/obj
      - /src/src/OpenPc.Scraper/obj
      - ~/.cache/ms-playwright:/ms-playwright
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  minio_dev_data:
