<div class="card overflow-hidden">
  <p class="border-b border-zinc-100 px-4 py-3 text-sm font-semibold text-zinc-700">
    Histórico de preço (90 dias)
  </p>

  @if (!geometry()) {
    <p class="px-4 py-3 text-sm text-zinc-500">Sem histórico suficiente para o gráfico.</p>
  } @else {
    <svg
      [attr.viewBox]="'0 0 ' + geometry()!.width + ' ' + geometry()!.height"
      class="mt-2 w-full px-4"
      role="img"
      [attr.aria-label]="'Histórico de preço: menor R$ ' + geometry()!.min + ', maior R$ ' + geometry()!.max"
    >
      <path [attr.d]="geometry()!.area" class="fill-brand-100" />
      <path [attr.d]="geometry()!.line" class="fill-none stroke-brand-600" stroke-width="2" />
    </svg>
    <p class="mt-2 px-4 pb-3 text-sm text-zinc-600">
      <span class="font-semibold">{{ formatBRL(geometry()!.last.price) }}</span>
      em {{ formatDate(geometry()!.last.date) }}
      <span class="text-zinc-400">(min {{ formatBRL(geometry()!.min) }}, máx {{ formatBRL(geometry()!.max) }})</span>
    </p>
  }
</div>
