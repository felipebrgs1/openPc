# OpenPC web — nginx (produção)
# SPA estática + headers de segurança. /api é roteado pelo Caddy.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: fallback para index.html em rotas client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome: cache longo e imutável
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Segurança (reforço; o Caddy já envia headers de borda)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
